# Публикует папку site/ на GitHub Pages при каждом push в main.
# Адрес: https://yanchek006.github.io/IMER/
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Страница 404 открывается по любому неверному адресу, в том числе вложенному
      # (/IMER/a/b). Чтобы стили и ссылки на ней не ломались, задаём базовый адрес.
      # Если позже подключите свой домен, эту строку удалите.
      - name: Базовый адрес для 404
        run: sed -i 's#<head>#<head>\n<base href="/${{ github.event.repository.name }}/">#' site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
